comments: |-
  Hyper Network Appliance combining dual-socket Intel Xeon Scalable server compute
  (Skylake/Cascade Lake, up to 28 cores per socket) with a Barefoot Tofino 64Q switch
  ASIC (32x 100GbE QSFP28, up to 3.2 Tbps switching capacity). Supports up to 512GB
  DDR4 ECC memory (16 DIMM slots per socket), 2x M.2 NVMe local storage (max 2 devices),
  optional PCIe expansion (Stratix 10 MX FPGA or standard PCIe cards), Sync-E/1588 PTP
  timing support, and BMC-based remote management (AST2500/AST2520). Runs ONIE, SONiC,
  or OpenBMC.

